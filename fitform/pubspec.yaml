name: fitform
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.0
  video_player: ^2.8.1
  file_picker: ^8.0.0
  image_picker: ^1.0.7

  path_provider: ^2.1.3
  http: ^1.6.0

  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/images/loading.jpg
    - assets/images/avatars/
    - assets/images/posts/
    - assets/text/quotes.txt